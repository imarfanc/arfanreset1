<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>ArfanReset1</title><link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Icons: one stroke style, drawn from the Drafting Paper set. -->
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.5h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13 6.5 5.5A2 2 0 0 1 8.4 4h7.2a2 2 0 0 1 1.9 1.5L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v13H7.5A2.5 2.5 0 0 1 5 17.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H18"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-reveal" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.3 2.9 7.6 7 9 4.1-1.4 7-4.7 7-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.5 2.6 3.8 5.8 3.8 9.5s-1.3 6.9-3.8 9.5c-2.5-2.6-3.8-5.8-3.8-9.5s1.3-6.9 3.8-9.5z"/></symbol>
    <symbol id="i-access" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.3h.01M7.5 10.2c3 .9 6 .9 9 0M12 10.9v3.4M9.7 18l2.3-3.7 2.3 3.7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  </svg>

  <aside class="rail">
    <div class="brand"><img class="brand-mark" src="app-icon.png" alt="" width="34" height="34"><div><strong>ArfanReset1</strong><small>A fresh start for your Mac</small></div></div>
    <nav aria-label="Setup pages" id="nav"></nav>
    <div class="rail-foot">
      <div class="rail-foot-head"><span id="progress-label">Your setup checklist</span></div>
      <div class="meter" id="meter" role="img" aria-label="Setup progress"></div>
      <small>You tick off each step yourself.</small>
      <label class="switch"><input type="checkbox" role="switch" id="sound-switch" checked><span class="track" aria-hidden="true"></span><span>Sounds</span></label>
    </div>
  </aside>
  <div class="workspace">
    <header class="top"><span class="crumb" id="breadcrumb">Overview</span><span class="badge" id="activity" role="status">Ready</span></header>
    <main id="main" tabindex="-1"><h1>Loading your setup…</h1><p>Reading bundled resources.</p></main>
    <section class="run-log" aria-label="Run log">
      <div class="splitter" id="log-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize run log" tabindex="0"></div>
      <div class="log-bar"><strong>Run log</strong><span class="log-peek" id="log-peek"></span><div class="log-tools"><button class="sm" id="cancel" data-sound="destructive" hidden>Stop</button><button class="sm" id="copy-log" data-sound="none">Copy log</button><button class="sm" id="toggle-log" aria-expanded="true" aria-controls="log" data-sound="none"><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg><span>Collapse</span></button></div></div>
      <pre id="log" tabindex="0">Choose a check or setup action. Results appear here.</pre>
    </section>
  </div>
  <dialog id="guide"><div class="dialog-bar"><strong id="guide-title">Reference guide</strong><button class="sm" id="close-guide">Close guide</button></div><iframe title="Offline reference guide" id="guide-frame"></iframe></dialog>
  <div id="toast" class="toast" role="status" hidden><svg class="icon" aria-hidden="true"><use href="#i-check-circle"/></svg><span id="toast-text"></span></div>
  <script src="app.js"></script>
</body>
</html>
